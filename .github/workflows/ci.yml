name: CI

on:
  push:
    branches: [ main, lab4 ]
  pull_request:

jobs:
  build-web:
    name: build-cryptolab-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: src/CryptoLab.Web
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cryptolab-web:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/cryptolab-web:${{ github.sha }}