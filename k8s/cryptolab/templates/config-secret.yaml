apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cryptolab.fullname" . }}-api-cm
  labels:
    {{- include "cryptolab.labels" . | nindent 4 }}
data:
  ASPNETCORE_URLS: "http://+:{{ .Values.api.port }}"
  ASPNETCORE_ENVIRONMENT: {{ .Values.api.environment | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cryptolab.fullname" . }}-secret
  labels:
    {{- include "cryptolab.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.db.password | quote }}
  ConnectionStrings__Default: {{ printf "Host=%s-db;Port=%v;Database=%s;Username=%s;Password=%s" (include "cryptolab.fullname" .) .Values.db.port .Values.db.name .Values.db.user .Values.db.password | quote }}