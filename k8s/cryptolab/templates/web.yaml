apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cryptolab.fullname" . }}-web
  labels:
    {{- include "cryptolab.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: web
    spec:
      containers:
        - name: web
          image: "{{ .Values.web.image.repository }}:{{ .Values.web.image.tag }}"
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.web.port }}
          env:
            - name: API_UPSTREAM
              value: "{{ include "cryptolab.fullname" . }}-api:{{ .Values.api.port }}"
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cryptolab.fullname" . }}-web
  labels:
    {{- include "cryptolab.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: web
  ports:
    - port: {{ .Values.web.port }}
      targetPort: {{ .Values.web.port }}