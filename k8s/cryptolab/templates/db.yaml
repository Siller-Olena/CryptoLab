apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ .Values.db.storage.storageClassName }}
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: Immediate
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ include "cryptolab.fullname" . }}-db-pv
  labels:
    {{- include "cryptolab.labels" . | nindent 4 }}
spec:
  capacity:
    storage: {{ .Values.db.storage.size }}
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: {{ .Values.db.storage.storageClassName }}
  hostPath:
    path: {{ .Values.db.storage.hostPath }}
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "cryptolab.fullname" . }}-db-pvc
  labels:
    {{- include "cryptolab.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.db.storage.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.db.storage.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cryptolab.fullname" . }}-db
  labels:
    {{- include "cryptolab.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: db
  ports:
    - port: {{ .Values.db.port }}
      targetPort: {{ .Values.db.port }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "cryptolab.fullname" . }}-db
  labels:
    {{- include "cryptolab.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "cryptolab.fullname" . }}-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: db
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: db
    spec:
      containers:
        - name: postgres
          image: {{ .Values.db.image }}
          ports:
            - containerPort: {{ .Values.db.port }}
          env:
            - name: POSTGRES_DB
              value: {{ .Values.db.name | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.db.user | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "cryptolab.fullname" . }}-secret
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.db.user | quote }}, "-d", {{ .Values.db.name | quote }}]
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "cryptolab.fullname" . }}-db-pvc